# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the Express API (the storefront is hosted on Vercel, see frontend/vercel.json).
# Values marked `sync: false` are asked for once when the Blueprint is created (keep them out of git).
services:
  - type: web
    name: anm-shop-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render is one reverse proxy in front of the API (needed for per-IP rate limits).
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # The Vercel storefront URL, e.g. https://anm-shop.vercel.app (comma-separate several).
      - key: FRONTEND_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
